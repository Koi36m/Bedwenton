name: M6 Java 25 Verification

on:
  push:
    branches: [m6-implementation, m6-actions-verification]
  workflow_dispatch:
    inputs:
      full_reference_regeneration:
        description: Independently regenerate all accepted M1-M6 golden/reference datasets
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify-m6:
    name: Java 25 — 415 tests and M6 release verification
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Record toolchain and exact source identity
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/m6-evidence"
          {
            git rev-parse HEAD
            git rev-parse HEAD^{tree}
            java -version
            javac -version
            ./gradlew --version
          } > "$RUNNER_TEMP/m6-evidence/toolchain.txt" 2>&1
          cat "$RUNNER_TEMP/m6-evidence/toolchain.txt"

      - name: Verify frozen baseline, approved specification and implementation hashes
        shell: bash
        run: |
          set -o pipefail
          {
            sha256sum -c verification/m6/FROZEN-M1-M5-SHA256SUMS.txt
            sha256sum -c verification/m6/APPROVED-M6-SHA256SUMS.txt
            sha256sum -c verification/m6/IMPLEMENTATION-SOURCE-SHA256SUMS.txt
            (cd src/test/resources/golden && sha256sum -c MANIFEST.sha256)
            (cd src/test/resources/m2/golden && sha256sum -c MANIFEST.sha256)
            (cd src/test/resources/m2/review && sha256sum -c MANIFEST.sha256)
            (cd src/test/resources/m6/reference && sha256sum -c MANIFEST.sha256)
            (cd src/test/resources/m3/reference && sha256sum -c MANIFEST.sha256)
            (cd src/test/resources/m4/reference && sha256sum -c MANIFEST.sha256)
            (cd src/test/resources/m5/reference && sha256sum -c MANIFEST.sha256)
          } 2>&1 | tee "$RUNNER_TEMP/m6-evidence/source-integrity.txt"

      - name: Fresh clean test
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon -Porg.gradle.java.installations.auto-download=false clean test 2>&1 | tee "$RUNNER_TEMP/m6-evidence/clean-test.txt"

      - name: Gradle check and dependency guard
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon -Porg.gradle.java.installations.auto-download=false check 2>&1 | tee "$RUNNER_TEMP/m6-evidence/check.txt"
          ./gradlew --no-daemon -Porg.gradle.java.installations.auto-download=false dependencies --configuration runtimeClasspath 2>&1 | tee "$RUNNER_TEMP/m6-evidence/runtime-dependencies.txt"
          grep -q "No dependencies" "$RUNNER_TEMP/m6-evidence/runtime-dependencies.txt"

      - name: Verify exact JUnit counts, production compiler warnings and the M6 API surface
        shell: bash
        run: |
          python3 - <<'PY' | tee "$RUNNER_TEMP/m6-evidence/test-summary.txt"
          import os, re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          reports = sorted(Path('build/test-results/test').glob('TEST-*.xml'))
          counts = dict(core=0, time=0, curve=0, sample=0, scene=0, delivery=0)
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in reports:
              suite = ET.parse(path).getroot()
              parts = suite.attrib['name'].split('.')
              counts[parts[2] if parts[2] in ('scene', 'delivery') else parts[3]] += int(suite.attrib['tests'])
              for key in totals:
                  totals[key] += int(suite.attrib.get(key, '0'))
          print('JUnit XML reports:', len(reports))
          print('Milestone counts:', counts)
          print('Totals:', totals)
          assert counts == dict(core=125, time=66, curve=63, sample=59, scene=50, delivery=52), counts
          assert totals == dict(tests=415, failures=0, errors=0, skipped=0), totals
          log = (Path(os.environ['RUNNER_TEMP'])/'m6-evidence/clean-test.txt').read_text()
          production = log.split('> Task :compileJava', 1)[1].split('> Task :', 1)[0]
          assert 'warning:' not in production, production
          print('Production compiler warnings: 0')
          public = sorted(m.group(1) for p in Path('src/main/java/workshop/vfx/delivery').glob('*.java')
                          for m in re.finditer(r'^public\s+(?:final\s+)?(?:class|record|enum|interface)\s+(\w+)', p.read_text(), re.M))
          print('M6 public types:', public)
          assert public == ['DeliveryPlan', 'DeliveryPlanner', 'DeliveryPolicy', 'DeliveryRequest', 'EffectDelivery', 'EffectPriority', 'EffectRecipe', 'LayerRole', 'Outcome', 'QualityTier'], public
          banned = re.compile(r'org\.bukkit|io\.papermc|net\.minecraft|com\.destroystokyo')
          assert not any(banned.search(p.read_text()) for p in Path('src/main/java').rglob('*.java')), 'platform import found'
          print('Paper/Bukkit/Minecraft references in production sources: 0')
          PY

      - name: Independent boundary and production performance probes
        shell: bash
        run: |
          python3 verification/m6/run_probes.py "$RUNNER_TEMP/m6-evidence" "$RUNNER_TEMP/m6-probe-classes"

      - name: Independently regenerate every accepted golden and reference dataset
        if: (github.event_name == 'workflow_dispatch' && inputs.full_reference_regeneration) || contains(github.event.head_commit.message, '[m6-release-verification]')
        shell: bash
        run: |
          set -o pipefail
          python3 verification/m6/regenerate_all.py "$RUNNER_TEMP/m6-regenerated" 2>&1 | tee "$RUNNER_TEMP/m6-evidence/reference-regeneration.txt"

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m6-java25-verification-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/m6-evidence/
            build/test-results/test/
            build/reports/tests/test/
