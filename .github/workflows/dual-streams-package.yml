name: Dual Streams Review Package
on:
  push:
    branches: [experiment/dual-stream-end-rod-review]
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: streams-java25-verification-39764375954
          run-id: 39764375954
          github-token: ${{ github.token }}
          path: _review_evidence
      - name: Preserve tested source, original JAR, full verification and published Git history
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 325f58aa3034c51aa34ef1cb05eb5c0a1e51dfb3 HEAD -- paper-adapter src verification gradle build.gradle settings.gradle
          sha256sum -c docs/dual-streams/IMPLEMENTATION-SHA256SUMS.txt
          sha256sum -c docs/dual-streams/FROZEN-BASELINE-SHA256SUMS.txt
          mkdir -p "$RUNNER_TEMP/streams-delivery"
          git archive --format=zip --prefix=bedwenton-dual-streams/ -o "$RUNNER_TEMP/streams-delivery/bedwenton-dual-streams-source.zip" HEAD
          git bundle create "$RUNNER_TEMP/streams-delivery/bedwenton-dual-streams-github-snapshot.git.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/streams-delivery/bedwenton-dual-streams-github-snapshot.git.bundle"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil,subprocess,zipfile
          root=Path('.');out=Path(os.environ['RUNNER_TEMP'])/'streams-delivery';ev=root/'_review_evidence'
          jars=list(ev.rglob('bedwenton-vfx-paper-0.8.0-streams.1.jar'));assert len(jars)==1
          jar=jars[0];assert hashlib.sha256(jar.read_bytes()).hexdigest()=='0af73be9b7be07ce3e5826b157b26bce55026084238b92259ecd38792b3df2b3'
          shutil.copyfile(jar,out/jar.name)
          cp=dict(github_evidence=subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),github_final_tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip(),github_tested_source='325f58aa3034c51aa34ef1cb05eb5c0a1e51dfb3',tested_source_tree='fb0830a0c6549671ce0c1502dd3bfc16f36e3c2d',native_implementation='15b84d0dc3066c74cdab5c2d30290de3c30b400b',bundle_kind='Published GitHub snapshot ancestry; distinct from native history bundle preserved locally',verification_run='https://github.com/Koi36m/Bedwenton/actions/runs/39764375954',tests=659,visual_reference_match='HYPOTHESIS UNCONFIRMED; uploaded clip inspected; native effect not observed',minecraft_smoke='NOT RUN')
          (out/'GIT-CHECKPOINT.json').write_text(json.dumps(cp,indent=2)+'\n')
          prefix='bedwenton-dual-streams/'
          with zipfile.ZipFile(out/'bedwenton-dual-streams-source.zip','a',compression=zipfile.ZIP_DEFLATED) as z:
              z.writestr(prefix+'DELIVERY-CHECKPOINT.json',(out/'GIT-CHECKPOINT.json').read_bytes())
              for p in sorted(ev.rglob('*')):
                  if p.is_file():z.write(p,prefix+'verification-evidence/'+str(p.relative_to(ev)))
              names=sorted(n for n in z.namelist() if not n.endswith('/'))
              z.writestr(prefix+'SOURCE-SHA256SUMS.txt',''.join(hashlib.sha256(z.read(n)).hexdigest()+'  '+n.removeprefix(prefix)+'\n' for n in names))
              assert z.testzip() is None
          (out/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir()) if p.name!='SHA256SUMS.txt'))
          PY
          cd "$RUNNER_TEMP/streams-delivery"
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: bedwenton-dual-streams-review-package
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/streams-delivery/
